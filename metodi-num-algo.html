const categories = [{"id": "zeri", "name": "Zeri di Funzione"}, {"id": "sys_nonlin", "name": "Sistemi Non Lineari"}, {"id": "sys_lin_iter", "name": "Sistemi Lineari (Iterativi)"}, {"id": "opt_grad", "name": "Ottimizzazione (Gradiente)"}, {"id": "min_quad", "name": "Minimi Quadrati"}, {"id": "interp", "name": "Interpolazione"}, {"id": "utils", "name": "Playground / Extra"}];
const exercises = [{"id": "bisezione", "cat": "zeri", "title": "Metodo di Bisezione", "template": "import numpy as np\n\ndef metodo_bisezione(fname, a, b, tolx, tolf):\n    fa = fname(a)\n    fb = fname(b)\n    if # to do:\n        print(\"Non \u00e8 possibile applicare il metodo di bisezione \\n\")\n        return None, None, None\n\n    it = 0\n    v_xk = []\n    max_it = int(np.ceil(np.log2((b - a) / tolx))) - 1\n\n    while # to do:\n        xk = # to do\n        v_xk.append(xk)\n        it += 1\n        fxk = fname(xk)\n\n        if np.abs(fxk) < tolf:\n            return xk, it, np.array(v_xk)\n\n        if # to do:\n            b = xk\n            fb = fxk\n        elif # to do:\n            a = xk\n            fa = fxk\n\n    return xk, it, np.array(v_xk)\n", "test": "\nf = lambda x: x**2 - 2\nres = metodo_bisezione(f, 1, 2, 1e-8, 1e-8)\nassert res[0] is not None, \"Ritorno nullo\"\nassert abs(res[0] - np.sqrt(2)) < 1e-5, \"Soluzione errata\"\nprint(\"\u2713 Bisezione corretta!\")\n"}, {"id": "falsi", "cat": "zeri", "title": "Falsa Posizione", "template": "import numpy as np\n\ndef falsi(fname, a, b, maxit, tolx, tolf):\n    fa = fname(a)\n    fb = fname(b)\n    if # to do:\n        print(\"Non \u00e8 possibile applicare\\n\")\n        return None, None, None\n\n    it = 0\n    v_xk = []\n    fxk = tolf + 1\n    errore = tolx + 1\n    xk = None\n    xprec = a\n\n    while # to do:\n        xk = # to do\n        fxk = fname(xk)\n\n        if np.abs(fxk) < tolf:\n            return xk, it, np.array(v_xk)\n\n        if # to do:\n            b = xk\n            fb = fxk\n        elif # to do:\n            a = xk\n            fa = fxk\n\n        if xk != 0:\n            errore = # to do\n        else:\n            errore = # to do\n\n        xprec = xk\n        v_xk.append(xk)\n        it += 1\n\n    return xk, it, np.array(v_xk)\n", "test": "\nf = lambda x: x**2 - 2\nres = falsi(f, 1, 2, 100, 1e-8, 1e-8)\nassert res[0] is not None, \"Ritorno nullo\"\nassert abs(res[0] - np.sqrt(2)) < 1e-5, \"Soluzione errata\"\nprint(\"\u2713 Falsa posizione corretta!\")\n"}, {"id": "corde", "cat": "zeri", "title": "Metodo delle Corde", "template": "import numpy as np\n\ndef corde(fname, a, b, coeff_ang, x0, tolx, tolf, nmax):\n    v_xk = []\n    xk = x0\n    it = 0\n    errorex = 1 + tolx\n    erroref = 1 + tolf\n    xk1 = None\n\n    if abs(coeff_ang) <= np.spacing(1):\n        print(\"Coefficiente angolare nullo\")\n        return None, None, None\n\n    while # to do:\n        fxk = fname(xk)\n        d = # to do\n        xk1 = # to do\n        fxk1 = fname(xk1)\n\n        if xk1 != 0:\n            errorex = # to do\n        else:\n            errorex = # to do\n\n        erroref = np.abs(fxk1)\n        xk = xk1\n        it += 1\n        v_xk.append(xk1)\n\n    return xk1, it, np.array(v_xk)\n", "test": "\nf = lambda x: x**2 - 2\nres = corde(f, 1, 2, 3.0, 1.5, 1e-8, 1e-8, 100)\nassert res[0] is not None, \"Ritorno nullo\"\nassert abs(res[0] - np.sqrt(2)) < 1e-5, \"Soluzione errata\"\nprint(\"\u2713 Metodo delle corde corretto!\")\n"}, {"id": "newton", "cat": "zeri", "title": "Metodo di Newton", "template": "import numpy as np\n\ndef newton(fname, fpname, x0, tolx, tolf, nmax):\n    v_xk = []\n    xk = x0\n    it = 0\n    xk1 = None\n    errorex = 1 + tolx\n    erroref = 1 + tolf\n\n    while # to do:\n        fxk = fname(xk)\n        fpxk = fpname(xk)\n\n        if # to do:\n            print(\"Derivata nulla\")\n            return None, None, None\n\n        d = # to do\n        xk1 = # to do\n        fxk1 = fname(xk1)\n\n        if xk1 != 0:\n            errorex = # to do\n        else:\n            errorex = # to do\n\n        erroref = np.abs(fxk1)\n        v_xk.append(xk1)\n        xk = xk1\n        it += 1\n\n    return xk1, it, np.array(v_xk)\n", "test": "\nf = lambda x: x**2 - 2\nfp = lambda x: 2*x\nres = newton(f, fp, 1.5, 1e-8, 1e-8, 100)\nassert res[0] is not None\nassert abs(res[0] - np.sqrt(2)) < 1e-5\nprint(\"\u2713 Metodo di Newton corretto!\")\n"}, {"id": "newton_modificato", "cat": "zeri", "title": "Newton Modificato (Radici Multiple)", "template": "import numpy as np\n\ndef newton_modificato(fname,fpname,m,x0,tolx,tolf,nmax):\n    v_xk=[]\n    xk=x0\n    xk1=None\n    it=0\n    errorex=1+tolx\n    erroref=1+tolf\n\n    while # to do:\n        fxk=fname(xk)\n        fpxk=fpname(xk)\n\n        if # to do: # derivata vicina a zero\n            print(\"Newton Modificato: La derivata prima si annulla\")\n            return None,None,None\n\n        d= # to do\n        xk1= # to do\n        fxk1=fname(xk1)\n\n        if xk1!=0:\n            errorex= # to do\n        else:\n            errorex= # to do\n\n        erroref=np.abs(fxk1)\n        v_xk.append(xk1)\n        xk=xk1\n        it=it+1\n\n    return xk1,it,np.array(v_xk)\n", "test": "\nf = lambda x: (x-2)**2\nfp = lambda x: 2*(x-2)\nres = newton_modificato(f, fp, 2, 1.0, 1e-8, 1e-8, 100)\nassert res[0] is not None\nassert abs(res[0] - 2.0) < 1e-5\nprint(\"\u2713 Metodo di Newton Modificato corretto!\")\n"}, {"id": "secanti", "cat": "zeri", "title": "Metodo delle Secanti", "template": "import numpy as np\n\ndef secanti(fname, xm1, x0, tolx, tolf, nmax):\n    v_xk = []\n    it = 0\n    errorex = 1 + tolx\n    erroref = 1 + tolf\n    xkm1 = xm1\n    xk = x0\n    xk1 = None\n\n    while # to do:\n        fxkm1 = fname(xkm1)\n        fxk = fname(xk)\n        c_ang_k = # to do\n\n        if # to do:\n            return None, None, None\n\n        d = # to do\n        xk1 = # to do\n        fxk1 = fname(xk1)\n        v_xk.append(xk1)\n\n        if xk1 != 0:\n            errorex = abs(d) / abs(xk1)\n        else:\n            errorex = abs(d)\n\n        erroref = np.abs(fxk1)\n        xkm1 = xk\n        xk = xk1\n        it += 1\n\n    return xk1, it, np.array(v_xk)\n", "test": "\nf = lambda x: x**2 - 2\nres = secanti(f, 1.0, 2.0, 1e-8, 1e-8, 100)\nassert res[0] is not None\nassert abs(res[0] - np.sqrt(2)) < 1e-5\nprint(\"\u2713 Metodo delle Secanti corretto!\")\n"}, {"id": "stima_ordine", "cat": "zeri", "title": "Stima dell'Ordine", "template": "import numpy as np\n\ndef stima_ordine(xk, iterazioni):\n    # La funzione calcola l'ordine di convergenza p \n    k = iterazioni - 4\n\n    p = # to do\n\n    ordine = p\n    return ordine\n", "test": "\n# Testiamo con una successione che converge quadraticamente\nxk = np.array([2.0, 1.5, 1.42, 1.4142, 1.41421356])\ntry:\n    p = stima_ordine(xk, len(xk))\n    print(\"Ordine stimato:\", p)\n    assert p > 0, \"Ordine calcolato in modo errato o negativo\"\n    print(\"\u2713 Stima ordine calcolata correttamente!\")\nexcept Exception as e:\n    print(f\"Errore nella stima dell'ordine: {e}\")\n    raise\n"}, {"id": "newton_raphson", "cat": "sys_nonlin", "title": "Newton-Raphson", "template": "import numpy as np\n\ndef newton_raphson(initial_guess, F_numerical, J_numerical, tolX, tolF, max_iterations):\n    X = np.array(initial_guess, dtype=float)\n    it = 0\n    erroreF = 1 + tolF\n    erroreX = 1 + tolX\n    errore = []\n\n    while # to do:\n        jx = # to do\n        if # to do:\n            return None, None, None\n\n        fx = # to do\n        s = # to do\n        Xnew = # to do\n\n        normaXnew = np.linalg.norm(Xnew, 1)\n        if normaXnew != 0:\n            erroreX = # to do\n        else:\n            erroreX = # to do\n\n        errore.append(erroreX)\n        fxnew = # to do\n        erroreF = np.linalg.norm(fxnew, 1)\n        X = Xnew\n        it += 1\n\n    return X, it, errore\n", "test": "\ndef F(x): return np.array([x[0]**2 + x[1]**2 - 4, x[0]*x[1] - 1])\ndef J(x): return np.array([[2*x[0], 2*x[1]], [x[1], x[0]]])\nres = newton_raphson([1.5, 0.5], F, J, 1e-8, 1e-8, 50)\nassert res[0] is not None\nassert np.linalg.norm(F(res[0])) < 1e-6\nprint(\"\u2713 Newton-Raphson corretto!\")\n"}, {"id": "newton_raphson_corde", "cat": "sys_nonlin", "title": "Newton-Raphson (Corde)", "template": "import numpy as np\n\ndef newton_raphson_corde(initial_guess, F_numerical, J_numerical, tolX, tolF, max_iterations):\n    X = np.array(initial_guess, dtype=float)\n    it = 0\n    erroreF = 1 + tolF\n    erroreX = 1 + tolX\n    errore = []\n\n    # La Jacobiana viene calcolata SOLO alla prima iterazione\n    jx = # to do\n\n    if # to do:\n        print(\"La matrice Jacobiana non \u00e8 a rango massimo\")\n        return None, None, None\n\n    while # to do:\n        fx = # to do\n        s = # to do\n        Xnew = # to do\n\n        normaXnew = np.linalg.norm(Xnew, 1)\n        if normaXnew != 0:\n            erroreX = # to do\n        else:\n            erroreX = # to do\n\n        errore.append(erroreX)\n        fxnew = # to do\n        erroreF = np.linalg.norm(fxnew, 1)\n        X = Xnew\n        it += 1\n\n    return X, it, errore\n", "test": "\ndef F(x): return np.array([x[0]**2 + x[1]**2 - 4, x[0]*x[1] - 1])\ndef J(x): return np.array([[2*x[0], 2*x[1]], [x[1], x[0]]])\nres = newton_raphson_corde([1.5, 0.5], F, J, 1e-8, 1e-8, 50)\nassert res[0] is not None\nassert np.linalg.norm(F(res[0])) < 1e-5\nprint(\"\u2713 Newton-Raphson (Corde) corretto!\")\n"}, {"id": "newton_sham", "cat": "sys_nonlin", "title": "Newton-Shamanskii", "template": "import numpy as np\n\ndef newton_raphson_sham(initial_guess, F_numerical, J_numerical, tolX, tolF, update, max_iterations):\n    X = np.array(initial_guess, dtype=float)\n    it = 0\n    erroreF = 1 + tolF\n    erroreX = 1 + tolX\n    errore = []\n\n    while # to do:\n        if it % update == 0:\n            jx = # to do\n            if # to do:\n                return None, None, None\n\n        fx = # to do\n        s = # to do\n        Xnew = # to do\n\n        normaXnew = np.linalg.norm(Xnew, 1)\n        if normaXnew != 0:\n            erroreX = np.linalg.norm(Xnew - X, 1) / normaXnew\n        else:\n            erroreX = np.linalg.norm(Xnew - X, 1)\n\n        errore.append(erroreX)\n        fxnew = F_numerical(Xnew)\n        erroreF = np.linalg.norm(fxnew, 1)\n let pyodide;
let editor;
let currentEx = null;
const exerciseDocs = new Map();

const plotPanel = document.getElementById('plot-panel');
const plotArea = document.getElementById('plot-area');
const plotResizer = document.getElementById('plot-resizer');
const togglePlotButton = document.getElementById('toggle-plot');
document.pyodideMplTarget = plotArea;

function clearPlot() {
    plotArea.innerHTML = '<div class="plot-placeholder">I grafici generati con Matplotlib compariranno qui.</div>';
}

function setPlotCollapsed(collapsed) {
    plotPanel.classList.toggle('collapsed', collapsed);
    togglePlotButton.textContent = collapsed ? 'Espandi' : 'Comprimi';
    togglePlotButton.setAttribute('aria-expanded', String(!collapsed));
    requestAnimationFrame(refreshEditor);
}

document.getElementById('clear-plot').addEventListener('click', clearPlot);
togglePlotButton.addEventListener('click', () => setPlotCollapsed(!plotPanel.classList.contains('collapsed')));

const consoleWrap = document.getElementById('console-wrap');
const consoleSize = document.getElementById('console-size');
const resizer = document.getElementById('console-resizer');
let consoleHeight = 260;
let plotHeight = 240;

function workspaceHeight() {
    const main = document.getElementById('main').getBoundingClientRect();
    const header = document.getElementById('header').getBoundingClientRect();
    return Math.max(0, main.bottom - header.bottom);
}

function refreshEditor() {
    if (editor) editor.refresh();
}

function clampPanelHeights() {
    const available = workspaceHeight();
    const minimumEditor = 120;
    const currentPlot = plotPanel.classList.contains('collapsed') ? 42 : plotHeight;
    const allowedTotal = Math.max(220, available - minimumEditor);
    if (consoleHeight + currentPlot > allowedTotal) {
        const excess = consoleHeight + currentPlot - allowedTotal;
        if (!plotPanel.classList.contains('collapsed') && plotHeight > 120) {
            plotHeight = Math.max(120, plotHeight - excess);
        }
        const adjustedPlot = plotPanel.classList.contains('collapsed') ? 42 : plotHeight;
        consoleHeight = Math.max(110, Math.min(consoleHeight, allowedTotal - adjustedPlot));
    }
    consoleWrap.style.flexBasis = consoleHeight + 'px';
    consoleWrap.style.height = consoleHeight + 'px';
    if (!plotPanel.classList.contains('collapsed')) {
        plotPanel.style.flexBasis = plotHeight + 'px';
        plotPanel.style.height = plotHeight + 'px';
    }
    consoleSize.textContent = Math.round(consoleHeight) + 'px';
    refreshEditor();
}

function setConsoleHeight(value) {
    consoleHeight = Math.max(110, value);
    clampPanelHeights();
}

function setPlotHeight(value) {
    plotHeight = Math.max(120, value);
    clampPanelHeights();
}

setConsoleHeight(260);
document.getElementById('console-larger').addEventListener('click', () => setConsoleHeight(consoleHeight + 40));
document.getElementById('console-smaller').addEventListener('click', () => setConsoleHeight(consoleHeight - 40));
document.getElementById('console-reset').addEventListener('click', () => setConsoleHeight(260));

let resizingConsole = false;
resizer.addEventListener('pointerdown', event => {
    resizingConsole = true;
    resizer.classList.add('dragging');
    resizer.setPointerCapture(event.pointerId);
});
resizer.addEventListener('pointermove', event => {
    if (!resizingConsole) return;
    const main = document.getElementById('main').getBoundingClientRect();
    setConsoleHeight(main.bottom - event.clientY);
});
resizer.addEventListener('pointerup', () => {
    resizingConsole = false;
    resizer.classList.remove('dragging');
});

let resizingPlot = false;
plotResizer.addEventListener('pointerdown', event => {
    if (plotPanel.classList.contains('collapsed')) return;
    resizingPlot = true;
    plotResizer.classList.add('dragging');
    plotResizer.setPointerCapture(event.pointerId);
});
plotResizer.addEventListener('pointermove', event => {
    if (!resizingPlot) return;
    const main = document.getElementById('main').getBoundingClientRect();
    setPlotHeight(main.bottom - event.clientY);
});
plotResizer.addEventListener('pointerup', () => {
    resizingPlot = false;
    plotResizer.classList.remove('dragging');
});

window.addEventListener('resize', clampPanelHeights);

// Expand only when the plotting backend actually inserts a rendered figure.
const plotObserver = new MutationObserver(() => {
    if (plotArea.querySelector('canvas, img, svg')) {
        setPlotCollapsed(false);
        clampPanelHeights();
    }
});
plotObserver.observe(plotArea, {childList: true, subtree: true});



function printConsole(text, type='output') {
    const cons = document.getElementById('console');
    const div = document.createElement('div');
    div.className = type;
    div.textContent = text;
    cons.appendChild(div);
    cons.scrollTop = cons.scrollHeight;
}

async function init() {
    editor = CodeMirror.fromTextArea(document.getElementById('code'), {
        mode: 'python',
        theme: 'dracula',
        lineNumbers: true,
        indentUnit: 4,
        matchBrackets: true,
        extraKeys: {"Tab": function(cm){ cm.replaceSelection("    ", "end"); }}
    });

    const list = document.getElementById('ex-list');

    categories.forEach(cat => {
        const catDiv = document.createElement('div');
        catDiv.className = 'cat-title';
        catDiv.textContent = cat.name;
        list.appendChild(catDiv);

        const catExs = exercises.filter(e => e.cat === cat.id);
        catExs.forEach(ex => {
            const btn = document.createElement('button');
            btn.className = 'ex-btn';
            btn.textContent = ex.title;
            btn.onclick = () => loadExercise(ex.id, btn);
            list.appendChild(btn);

            if(!currentEx) {
                loadExercise(ex.id, btn);
            }
        });
    });

    try {
        pyodide = await loadPyodide();
        printConsole("Caricamento pacchetti (Numpy/Scipy)...", "system");
        await pyodide.loadPackage(['numpy', 'scipy', 'matplotlib']);
        printConsole("✅ Ambiente Python pronto! Puoi compilare e valutare.", "pass");
        document.getElementById('run-btn').disabled = false;
        document.getElementById('run-btn').textContent = "▶ Valuta Codice (Run)";
    } catch(e) {
        printConsole("Errore caricamento Pyodide: " + e, "fail");
    }
}

function loadExercise(id, btnElement) {
    const ex = exercises.find(e => e.id === id);
    if (!ex) return;
    const reset = currentEx === id;
    if (reset || !exerciseDocs.has(id)) {
        exerciseDocs.set(id, new CodeMirror.Doc(ex.template, 'python'));
    }
    currentEx = id;
    editor.swapDoc(exerciseDocs.get(id));
    document.getElementById('ex-title').textContent = ex.title;
    if (btnElement) {
        document.querySelectorAll('.ex-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }
    document.getElementById('console').innerHTML = '';
    printConsole(reset ? '↺ ' + ex.title + ' ripristinato.' : '📝 ' + ex.title + ' caricato.', 'system');
    editor.refresh();
}

document.getElementById('run-btn').onclick = async () => {
    if(!pyodide) return;
    const ex = exercises.find(e => e.id === currentEx);
    const userCode = editor.getValue();
    clearPlot();
    setPlotCollapsed(true);
    clampPanelHeights();
    const testCode = ex.test;

    printConsole("\n--- Esecuzione ---", "system");

    pyodide.setStdout({ batched: (str) => printConsole(str, "output") });
    pyodide.setStderr({ batched: (str) => printConsole(str, "fail") });

    const fullCode = userCode + "\n" + testCode;

    try {
        await pyodide.runPythonAsync(fullCode);
        printConsole("⭐⭐⭐ VALUTAZIONE COMPLETATA CON SUCCESSO! ⭐⭐⭐", "pass");
    } catch(err) {
        printConsole("❌ ERRORE O TEST FALLITO:", "fail");
        printConsole(err.message, "fail");
    }
};

init();
</script>
